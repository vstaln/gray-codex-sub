[package]
name = "gray-codex-sub"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "ChatGPT/Codex subscription provider plugin for the gray agent harness"

[lib]
name = "codex_sub"
path = "src/lib.rs"

[[bin]]
name = "codex-sub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
gray-core = { git = "https://github.com/vstaln/gray.git" }
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
