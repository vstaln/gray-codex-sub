[package]
name = "gray-codex-sub"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "ChatGPT/Codex subscription provider plugin for the gray agent harness"

[lib]
name = "codex_sub"
path = "src/lib.rs"

[[bin]]
name = "codex-sub"
path = "src/main.rs"

[dependencies]
gray-core = { git = "https://github.com/vstaln/gray.git" }
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
# Do NOT set `panic = "abort"` here: startup degrades hostile hosts
# through catch_unwind (tokio runtime build, per-request handlers) —
# abort would turn those back into spawn-time kills.

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
